<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">Help Desk Java Full Stack</title>
  <desc id="description">Banner em azul-escuro e ciano para uma plataforma profissional de gestão de chamados de TI.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.55" stop-color="#08111f"/>
      <stop offset="1" stop-color="#061827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1728" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#091321" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#164e63" stroke-opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="480" rx="30" fill="url(#background)"/>
  <rect width="1600" height="480" rx="30" fill="url(#grid)"/>
  <ellipse cx="1330" cy="82" rx="330" ry="240" fill="url(#glow)"/>
  <ellipse cx="140" cy="470" rx="300" ry="190" fill="url(#glow)" opacity="0.35"/>

  <g transform="translate(84 68)">
    <rect width="64" height="64" rx="18" fill="#083344" stroke="#22d3ee" stroke-opacity="0.6"/>
    <path d="M32 14 47 20v11c0 10-6.2 18.8-15 23-8.8-4.2-15-13-15-23V20l15-6Z" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linejoin="round"/>
    <path d="m25 32 5 5 10-11" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="168" y="88" fill="#22d3ee" font-size="16" font-weight="700" letter-spacing="5">CENTRAL DE TI</text>
    <text x="82" y="218" fill="#f8fafc" font-size="78" font-weight="800" letter-spacing="-3">Help Desk</text>
    <text x="84" y="264" fill="#94a3b8" font-size="25" font-weight="400">Gestão de chamados com segurança, contexto e rastreabilidade.</text>

    <g transform="translate(84 310)">
      <rect width="148" height="42" rx="21" fill="#082f49" stroke="#0e7490"/>
      <circle cx="23" cy="21" r="5" fill="#34d399"/>
      <text x="39" y="27" fill="#cffafe" font-size="15" font-weight="600">API segura</text>

      <rect x="164" width="178" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="188" y="27" fill="#cbd5e1" font-size="15" font-weight="600">Fluxo auditável</text>

      <rect x="358" width="210" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="382" y="27" fill="#cbd5e1" font-size="15" font-weight="600">Interface responsiva</text>
    </g>

    <text x="84" y="409" fill="#64748b" font-size="15" font-weight="600" letter-spacing="2">JAVA 21  ·  SPRING BOOT 3.5  ·  REACT 19  ·  TYPESCRIPT</text>
  </g>

  <g transform="translate(900 54)" filter="url(#shadow)">
    <rect width="610" height="372" rx="28" fill="url(#panel)" stroke="#1e3a54"/>
    <rect x="1" y="1" width="608" height="54" rx="27" fill="#0b1524"/>
    <circle cx="31" cy="28" r="5" fill="#fb7185"/>
    <circle cx="49" cy="28" r="5" fill="#fbbf24"/>
    <circle cx="67" cy="28" r="5" fill="#34d399"/>
    <text x="92" y="34" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2">OPERAÇÃO DE SUPORTE</text>

    <g transform="translate(28 80)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect width="340" height="112" rx="18" fill="#0b1424" stroke="#1e3a54"/>
      <text x="20" y="27" fill="#22d3ee" font-size="11" font-weight="700" letter-spacing="2">CHAMADO #4B3812E3</text>
      <text x="20" y="55" fill="#f8fafc" font-size="18" font-weight="700">Acesso ao ambiente corporativo</text>
      <rect x="20" y="72" width="76" height="24" rx="12" fill="#082f49" stroke="#0e7490"/>
      <text x="35" y="89" fill="#a5f3fc" font-size="11" font-weight="700">ABERTO</text>
      <rect x="108" y="72" width="70" height="24" rx="12" fill="#172554" stroke="#3730a3"/>
      <text x="126" y="89" fill="#c7d2fe" font-size="11" font-weight="700">MÉDIA</text>
      <circle cx="309" cy="84" r="14" fill="#164e63"/>
      <path d="m303 84 4 4 8-9" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(392 80)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect width="190" height="112" rx="18" fill="#0b1424" stroke="#1e3a54"/>
      <text x="18" y="28" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.6">CHAMADOS ATIVOS</text>
      <text x="18" y="72" fill="#f8fafc" font-size="38" font-weight="800">24</text>
      <path d="M116 79c14-22 26-14 38-34 7-12 13-6 20-18" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
      <circle cx="174" cy="27" r="5" fill="#22d3ee"/>
    </g>

    <g transform="translate(28 222)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700" letter-spacing="2">FLUXO DO ATENDIMENTO</text>

      <g transform="translate(0 25)">
        <rect width="124" height="72" rx="16" fill="#082f49" stroke="#0e7490"/>
        <circle cx="24" cy="26" r="7" fill="#22d3ee"/>
        <text x="42" y="31" fill="#cffafe" font-size="13" font-weight="700">Aberto</text>
        <text x="18" y="55" fill="#67e8f9" font-size="11">Solicitação</text>
      </g>

      <path d="M136 61h34" stroke="#155e75" stroke-width="2" stroke-linecap="round"/>
      <path d="m163 55 8 6-8 6" fill="none" stroke="#22d3ee" stroke-width="2"/>

      <g transform="translate(182 25)">
        <rect width="142" height="72" rx="16" fill="#172554" stroke="#4338ca"/>
        <circle cx="24" cy="26" r="7" fill="#a78bfa"/>
        <text x="42" y="31" fill="#ddd6fe" font-size="13" font-weight="700">Em atendimento</text>
        <text x="18" y="55" fill="#a5b4fc" font-size="11">Técnico atribuído</text>
      </g>

      <path d="M336 61h34" stroke="#155e75" stroke-width="2" stroke-linecap="round"/>
      <path d="m363 55 8 6-8 6" fill="none" stroke="#22d3ee" stroke-width="2"/>

      <g transform="translate(382 25)">
        <rect width="172" height="72" rx="16" fill="#052e2b" stroke="#047857"/>
        <circle cx="24" cy="26" r="7" fill="#34d399"/>
        <text x="42" y="31" fill="#d1fae5" font-size="13" font-weight="700">Resolvido</text>
        <text x="18" y="55" fill="#6ee7b7" font-size="11">Histórico preservado</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1598" height="478" rx="29" fill="none" stroke="#164e63" stroke-opacity="0.55"/>
</svg>
