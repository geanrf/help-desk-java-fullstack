<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do Help Desk</title>
  <desc id="description">Fluxo do navegador React para a API REST Spring Boot, segurança JWT, persistência JPA e bancos H2 ou PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07101d"/>
      <stop offset="1" stop-color="#091827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1400" height="430" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="428" rx="25" fill="none" stroke="#164e63"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="56" y="55" fill="#22d3ee" font-size="14" font-weight="700" letter-spacing="4">ARQUITETURA</text>
    <text x="56" y="90" fill="#f8fafc" font-size="27" font-weight="750">Fluxo principal da aplicação</text>
    <text x="56" y="118" fill="#64748b" font-size="15">Monólito modular com autenticação stateless e persistência por ambiente.</text>

    <g transform="translate(54 162)">
      <rect width="248" height="158" rx="20" fill="#0b1627" stroke="#1e3a54"/>
      <rect x="20" y="20" width="46" height="46" rx="14" fill="#083344" stroke="#0e7490"/>
      <circle cx="43" cy="43" r="12" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <circle cx="43" cy="43" r="4" fill="#22d3ee"/>
      <text x="20" y="94" fill="#f8fafc" font-size="20" font-weight="700">React + TypeScript</text>
      <text x="20" y="120" fill="#94a3b8" font-size="13">Vite · Axios · React Router</text>
      <text x="20" y="141" fill="#64748b" font-size="12">Interface responsiva</text>
    </g>

    <path d="M315 241h88" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="329" y="222" fill="#67e8f9" font-size="12" font-weight="600">REST JSON</text>

    <g transform="translate(416 162)">
      <rect width="248" height="158" rx="20" fill="#0b1627" stroke="#1e3a54"/>
      <rect x="20" y="20" width="46" height="46" rx="14" fill="#172554" stroke="#4338ca"/>
      <path d="M43 30 53 34v8c0 7-4 13-10 16-6-3-10-9-10-16v-8l10-4Z" fill="none" stroke="#a5b4fc" stroke-width="2"/>
      <text x="20" y="94" fill="#f8fafc" font-size="20" font-weight="700">Spring Security</text>
      <text x="20" y="120" fill="#94a3b8" font-size="13">Bearer JWT · BCrypt · CORS</text>
      <text x="20" y="141" fill="#64748b" font-size="12">Autorização por perfil e chamado</text>
    </g>

    <path d="M677 241h88" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="693" y="222" fill="#67e8f9" font-size="12" font-weight="600">JWT válido</text>

    <g transform="translate(778 162)">
      <rect width="248" height="158" rx="20" fill="#0b1627" stroke="#1e3a54"/>
      <rect x="20" y="20" width="46" height="46" rx="14" fill="#052e2b" stroke="#047857"/>
      <path d="M31 35h24M31 43h24M31 51h16" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round"/>
      <text x="20" y="94" fill="#f8fafc" font-size="20" font-weight="700">Spring Boot API</text>
      <text x="20" y="120" fill="#94a3b8" font-size="13">Controllers · Services · DTOs</text>
      <text x="20" y="141" fill="#64748b" font-size="12">JPA · Hibernate · regras de negócio</text>
    </g>

    <path d="M1039 241h71" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(1123 145)">
      <rect width="223" height="92" rx="18" fill="#082f49" stroke="#0e7490"/>
      <ellipse cx="34" cy="30" rx="14" ry="7" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <path d="M20 30v24c0 4 6 7 14 7s14-3 14-7V30" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <text x="62" y="37" fill="#f8fafc" font-size="18" font-weight="700">H2 local</text>
      <text x="62" y="60" fill="#34d399" font-size="12" font-weight="700">AMBIENTE VALIDADO</text>

      <rect y="108" width="223" height="92" rx="18" fill="#111827" stroke="#475569"/>
      <ellipse cx="34" cy="138" rx="14" ry="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M20 138v24c0 4 6 7 14 7s14-3 14-7v-24" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="62" y="145" fill="#f8fafc" font-size="18" font-weight="700">PostgreSQL</text>
      <text x="62" y="168" fill="#fbbf24" font-size="12" font-weight="700">VALIDAÇÃO PENDENTE</text>
    </g>

    <g transform="translate(54 352)">
      <rect width="1292" height="42" rx="14" fill="#071624" stroke="#164e63"/>
      <circle cx="22" cy="21" r="5" fill="#22d3ee"/>
      <text x="38" y="26" fill="#94a3b8" font-size="13">Spring Data JPA isola a persistência; Flyway versiona o schema PostgreSQL; o perfil local usa Hibernate com H2 persistente.</text>
    </g>
  </g>
</svg>
