spring:
  application:
    name: help-desk-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:help-desk-api}
      expiration: ${JWT_EXPIRATION:PT1H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
